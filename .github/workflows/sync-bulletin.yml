name: Auto-Sync Bulletin from Google Sheets

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub minimum for scheduled runs is every 5 minutes
  workflow_dispatch:        # Manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --quiet openpyxl pillow

      - name: Download Google Sheet & regenerate bulletin
        run: |
          python refresh_bulletin.py --output operation-bulletin.html
          rm -f _latest_capacity_study.xlsx

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet operation-bulletin.html || ! git diff --quiet ob-home.html; then
            git add operation-bulletin.html ob-home.html
            git commit -m "Auto-sync: refresh bulletin from Google Sheets"
            git push
          else
            echo "No changes - bulletin already up to date."
          fi
